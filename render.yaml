services:
  - type: web
    name: survivor-draft
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: COMMISSIONER_PASSCODE
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Optional: turns on the weekly auto-scorer's access (it can only save scoring as progress, never publish).
      - key: LEAGUE_SCORING_TOKEN
        sync: false
